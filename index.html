<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moamen Photo Studio</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eef1f5;color:#202735;font-family:Arial,sans-serif}
header{background:#17243a;color:white;text-align:center;padding:18px}
header h2{margin:0 0 7px}
main{max-width:850px;margin:18px auto;padding:12px}
.panel{background:white;padding:16px;border-radius:14px;margin-bottom:14px;box-shadow:0 2px 9px #0001}
button,.upload{background:#203b60;color:white;border:0;padding:12px 17px;border-radius:8px;cursor:pointer;margin:4px}
input,select{padding:10px;border:1px solid #ccd2dc;border-radius:7px;margin:5px;max-width:100%}
.preview{width:210px;height:270px;margin:12px auto;background:#ddd;overflow:hidden;position:relative;border:2px solid #aaa}
canvas{width:100%;height:100%;object-fit:contain}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
label{font-size:14px}
@media(min-width:600px){.preview{width:260px;height:335px}}
</style>
</head>
<body>
<header>
<h2>Moamen Photo Studio</h2>
<div>استوديو صور المعاملات الشخصية</div>
</header>
<main>
<section class="panel">
<h3>1 - اختيار الصورة</h3>
<input type="file" id="photo" accept="image/*">
<div class="preview"><canvas id="canvas" width="600" height="780"></canvas></div>
</section>
<section class="panel">
<h3>2 - إعداد الصورة</h3>
<div class="controls">
<label>الخلفية:
<select id="bg">
<option value="#ffffff">أبيض</option>
<option value="#dce8f5">أزرق فاتح</option>
<option value="#eeeeee">رمادي فاتح</option>
</select>
</label>
<label>التكبير:
<input id="zoom" type="range" min="0.5" max="2.5" step="0.05" value="1">
</label>
<label>تحريك أفقي:
<input id="x" type="range" min="-200" max="200" value="0">
</label>
<label>تحريك عمودي:
<input id="y" type="range" min="-200" max="200" value="0">
</label>
</div>
</section>
<section class="panel">
<h3>3 - القاط الرسمي</h3>
<div class="controls">
<label>اللون:
<select id="suit">
<option value="#17243a">كحلي</option>
<option value="#171717">أسود</option>
<option value="#666666">رمادي</option>
</select>
</label>
<label>إظهار القاط:
<input type="checkbox" id="jacket" checked>
</label>
</div>
</section>
<section class="panel">
<h3>4 - الطباعة</h3>
<div class="controls">
<label>عدد الصور:
<select id="count">
<option>6</option><option>4</option><option>8</option>
</select>
</label>
<label>مقاس الصورة:
<select id="size">
<option value="35,45">3.5 × 4.5 سم</option>
<option value="40,60">4 × 6 سم</option>
</select>
</label>
</div>
<button onclick="savePhoto()">حفظ الصورة JPG</button>
<button onclick="printPhotos()">طباعة ورقة A4</button>
</section>
</main>
<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let img = new Image();
let hasImage = false;

const photo = document.getElementById("photo");
const bg = document.getElementById("bg");
const zoom = document.getElementById("zoom");
const xpos = document.getElementById("x");
const ypos = document.getElementById("y");
const suit = document.getElementById("suit");
const jacket = document.getElementById("jacket");

photo.addEventListener("change", function(e) {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(event) {
    img.onload = function() {
      hasImage = true;
      draw();
    };
    img.src = event.target.result;
  };
  reader.readAsDataURL(file);
});

[bg, zoom, xpos, ypos, suit, jacket].forEach(el => {
  el.addEventListener("input", draw);
});

function draw() {
  ctx.clearRect(0, 0, 600, 780);
  ctx.fillStyle = bg.value;
  ctx.fillRect(0, 0, 600, 780);

  if (!hasImage) {
    ctx.fillStyle = "#555";
    ctx.font = "28px Arial";
    ctx.textAlign = "center";
    ctx.fillText("اختر صورة للبدء", 300, 390);
    return;
  }

  const scale = Math.max(600 / img.width, 780 / img.height) * Number(zoom.value);
  const w = img.width * scale;
  const h = img.height * scale;
  const x = (600 - w) / 2 + Number(xpos.value);
  const y = (780 - h) / 2 + Number(ypos.value);

  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, 600, 780);
  ctx.clip();
  ctx.drawImage(img, x, y, w, h);
  ctx.restore();

  if (jacket.checked) {
    ctx.save();
    ctx.fillStyle = suit.value;
    ctx.beginPath();
    ctx.moveTo(0, 780);
    ctx.lineTo(0, 570);
    ctx.quadraticCurveTo(100, 550, 180, 570);
    ctx.lineTo(235, 650);
    ctx.lineTo(300, 590);
    ctx.lineTo(365, 650);
    ctx.lineTo(420, 570);
    ctx.quadraticCurveTo(500, 550, 600, 570);
    ctx.lineTo(600, 780);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.moveTo(235, 610);
    ctx.lineTo(300, 690);
    ctx.lineTo(365, 610);
    ctx.lineTo(335, 780);
    ctx.lineTo(265, 780);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(300, 690);
    ctx.lineTo(300, 780);
    ctx.stroke();
    ctx.restore();
  }
}

function savePhoto() {
  if (!hasImage) {
    alert("اختار صورة أولاً");
    return;
  }

  const link = document.createElement("a");
  link.download = "Moamen-Photo.jpg";
  link.href = canvas.toDataURL("image/jpeg", 0.95);
  link.click();
}

function printPhotos() {
  if (!hasImage) {
    alert("اختار صورة أولاً");
    return;
  }

  const count = Number(document.getElementById("count").value);
  const dimensions = document.getElementById("size").value.split(",");
  const width = Number(dimensions[0]);
  const height = Number(dimensions[1]);
  const imageData = canvas.toDataURL("image/jpeg", 0.95);

  const printWindow = window.open("", "_blank");
  if (!printWindow) {
    alert("اسمح بالنوافذ المنبثقة");
    return;
  }

  let pictures = "";
  for (let i = 0; i < count; i++) {
    pictures += `<img src="${imageData}" style="width:${width}mm;height:${height}mm;object-fit:cover">`;
  }

  printWindow.document.write(`
    <!DOCTYPE html>
    <html>
    <head>
      <meta charset="UTF-8">
      <style>
        @page { size: A4; margin: 10mm; }
        body { margin: 0; }
        .sheet {
          display: grid;
          grid-template-columns: repeat(2, ${width}mm);
          grid-template-rows: repeat(3, ${height}mm);
          gap: 5mm;
          justify-content: center;
          align-content: start;
        }
        img {
          width: ${width}mm;
          height: ${height}mm;
          display: block;
        }
      </style>
    </head>
    <body>
      <div class="sheet">${pictures}</div>
      <script>
        window.onload = () => setTimeout(() => window.print(), 700);
      <\/script>
    </body>
    </html>
  `);

  printWindow.document.close();
}

draw();
</script>
</body>
</html>
